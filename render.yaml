# Render.com free-tier deploy (https://render.com)
# Push repo to GitHub, "New → Blueprint", connect repo.
# Uses the Node runtime (NO credit card required for free tier).
services:
  - type: web
    name: talkbridge
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HF_MODEL
        value: facebook/nllb-200-distilled-600M
      - key: TRANSLATION_PROVIDER
        value: auto
      - key: HF_API
        sync: false
      - key: LIBRETRANSLATE_URL
        sync: false
      - key: NUXT_PUBLIC_SOCKET_URL
        sync: false
